name: ALICE Windows Desktop Build

concurrency:
  group: alice-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q alice
      - name: Run automated tests
        run: python -m pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows application and installer
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build ALICE desktop GUI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ALICE `
            --collect-all PySide6 `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all pyttsx3 `
            --collect-all sounddevice `
            --collect-all piper `
            --hidden-import pythoncom `
            --hidden-import win32com.client `
            --hidden-import win32timezone `
            --hidden-import win32gui `
            --hidden-import win32api `
            --hidden-import win32con `
            --hidden-import wmi `
            --hidden-import keyboard `
            alice/main.py
          if (-not (Test-Path "dist/ALICE/ALICE.exe")) {
            throw "PyInstaller did not produce dist/ALICE/ALICE.exe"
          }
          if ((Get-Item "dist/ALICE/ALICE.exe").Length -lt 1000000) {
            throw "ALICE.exe is unexpectedly small; refusing to upload an incomplete build."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $candidates) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          "ISCC_PATH=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" "installer/ALICE.iss"
          if (-not (Test-Path "dist/ALICE-Setup.exe")) {
            throw "Inno Setup did not produce dist/ALICE-Setup.exe"
          }
          if ((Get-Item "dist/ALICE-Setup.exe").Length -lt 1000000) {
            throw "Installer is unexpectedly small; refusing to upload it."
          }
      - name: Create portable package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ALICE/*" -DestinationPath "dist/ALICE-Windows-Portable.zip" -CompressionLevel Optimal
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-Windows-Installer
          path: dist/ALICE-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-Windows-Portable
          path: dist/ALICE-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "dist/ALICE-Setup.exe" "dist/ALICE-Windows-Portable.zip" --repo "${{ github.repository }}" --clobber
